vars:
  - name: TEAM
    value: platform
labels:
  team: "{{var:TEAM}}"
container_envs:
  - container_ref_name: "*"
    envs:
      - name: GLOBAL_FLAG
        value: "true"
      - name: REMOVE_ME
        value: "from-defaults"
  - container_ref_name: api
    envs:
      - name: API_DEFAULT
        value: "from-container-defaults"
